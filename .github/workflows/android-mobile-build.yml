name: Yomic Mobile Android APK

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile-build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit Tests & Build Debug + Release APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Yomic-Mobile-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Lightweight Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Yomic-Mobile-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk
